##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# Audio controls - float and center for quick access
windowrule {
  name = windowrule-3
  float = on
  match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|PulseAudio Volume Control)$
}

windowrule {
  name = windowrule-4
  size = 900 650
  center = on
  match:class = ^(pavucontrol|org.pulseaudio.pavucontrol|PulseAudio Volume Control)$
  match:fullscreen = 0
}


# Calculator / color picker / clipboard manager - small utility tools
windowrule {
  name = windowrule-5
  float = on
  match:class = ^(org.gnome.Calculator|qalculate-gtk|kooha|gpick|hyprpicker)$
}

windowrule {
  name = windowrule-6
  pin = on
  match:class = ^(gpick|hyprpicker)$
}

windowrule {
  name = windowrule-7
  center = on
  match:class = ^(org.gnome.Calculator)$
  match:fullscreen = 0
}


# File chooser dialogs - float and center
windowrule {
  name = windowrule-8
  float = on
  center = on
  match:title = ^(Open File|Save File|File Upload)$
}


# System settings / Bluetooth / Network popups - float for quick access
windowrule {
  name = windowrule-9
  float = on
  match:class = ^(blueman-manager|Blueman-manager|org.blueman.Manager|blueman)$
}

windowrule {
  name = windowrule-10
  size = 900 650
  center = on
  match:class = ^(blueman-manager|Blueman-manager|org.blueman.Manager|blueman)$
  match:fullscreen = 0
}


# File manager - float for easy file operations (try multiple possible class names)
windowrule {
  name = windowrule-11
  float = on
  match:class = ^(nautilus|org.gnome.Nautilus|nemo|thunar|Thunar|yazi)$
}

windowrule {
  name = windowrule-12
  size = 1500 900
  center = on
  match:class = ^(nautilus|org.gnome.Nautilus|nemo|thunar|Thunar|yazi)$
  match:fullscreen = 0
}


# Terminal - float ghostty in center
windowrule {
  name = windowrule-13
  float = on
  match:class = ^(com.mitchellh.ghostty)$
}

windowrule {
  name = windowrule-14
  size = 1800 900
  center = on
  match:class = ^(com.mitchellh.ghostty)$
  match:fullscreen = 0
}


# Task Manager - float Mission Center in center
windowrule {
  name = windowrule-15
  float = on
  match:class = ^(io.missioncenter.MissionCenter)$
}

windowrule {
  name = windowrule-16
  size = 1200 800
  center = on
  match:class = ^(io.missioncenter.MissionCenter)$
  match:fullscreen = 0
}


# Communication apps - float Telegram and Discord (native and Flatpak)
windowrule {
  name = windowrule-17
  float = on
  match:class = ^(telegram|discord|com.discordapp.Discord|org.telegram.desktop|org.telegram.TelegramDesktop|io.github.tdesktop_x64.TelegramDesktop)$
}

windowrule {
  name = windowrule-18
  size = 1800 1200
  center = on
  match:class = ^(telegram|discord|com.discordapp.Discord|org.telegram.desktop|org.telegram.TelegramDesktop|io.github.tdesktop_x64.TelegramDesktop)$
  match:fullscreen = 0
}


# Workspace focus switching is handled globally by focus_on_activate = true in misc section

# Wi-Fi Menu (Rust TUI)
windowrule {
  name = windowrule-wifi-menu-float
  float = on
  match:title = ^(Wi-Fi Menu)$
}

windowrule {
  name = windowrule-wifi-menu-size
  size = 1600 900
  center = on
  match:title = ^(Wi-Fi Menu)$
  match:fullscreen = 0
}

# Hyprmonitor (Rust TUI)
windowrule {
  name = windowrule-hyprmonitor-float
  float = on
  match:title = ^(Hyprmonitor)$
}

windowrule {
  name = windowrule-hyprmonitor-size
  size = 1600 900
  center = on
  match:title = ^(Hyprmonitor)$
  match:fullscreen = 0
}
